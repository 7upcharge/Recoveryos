<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RecoveryOS — Operations Control Center{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/control-center.css') }}">
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="brand-section">
      <span class="brand-logo">RecoveryOS</span>
      <span class="brand-title">Control Center</span>
      <span class="brand-sub">AI Revenue Recovery System</span>
    </div>

    <nav class="nav-links">
      <a href="{{ url_for('dashboard.index') }}" class="nav-item {% if active_page == 'overview' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('dashboard.cases') }}" class="nav-item {% if active_page == 'cases' %}active{% endif %}">Cases</a>
      <a href="{{ url_for('dashboard.audit') }}" class="nav-item {% if active_page == 'audit' %}active{% endif %}">Audit / Activity</a>
    </nav>

    <div class="system-status">
      <span class="pulse-dot"></span>
      <span>Pipeline Active</span>
    </div>
  </header>

  <!-- Page Content Container -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
